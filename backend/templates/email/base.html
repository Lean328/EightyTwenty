<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light only">
<title>{{ subject }}</title>
</head>
<body style="margin:0;padding:0;background-color:#F4EFE6;-webkit-text-size-adjust:100%;">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;color:#F4EFE6;">{% block preheader %}{% endblock %}</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#F4EFE6;">
  <tr>
    <td align="center" style="padding:32px 12px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;">
        <tr>
          <td style="padding:0 4px 14px;font-family:Georgia,'Times New Roman',serif;font-size:22px;line-height:1;color:#33251F;">EightyTwenty</td>
          <td align="right" style="padding:0 4px 14px;font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:13px;line-height:1;color:#7A6B62;">{% block place %}{% endblock %}</td>
        </tr>
        <tr>
          <td colspan="2" style="background-color:#FDFBF7;border:1px solid #E7DFD3;border-radius:12px;padding:28px 28px 30px;font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:15px;line-height:1.55;color:#33251F;">
{% block content %}{% endblock %}
          </td>
        </tr>
        <tr>
          <td colspan="2" style="padding:16px 4px 0;font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:12px;line-height:1.5;color:#8C7D73;">
            {% block footer %}EightyTwenty · Wholesome food, great coffee · Canberra{% endblock %}
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
