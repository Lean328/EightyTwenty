{% extends "email/base.html" %}
{% block preheader %}{{ paragraphs.0|truncatechars:110 }}{% endblock %}
{% block content %}
            <h1 style="margin:0 0 16px;font-family:Georgia,'Times New Roman',serif;font-size:24px;font-weight:normal;line-height:1.25;color:#33251F;">{{ subject }}</h1>
            {% for paragraph in paragraphs %}<p style="margin:0 0 14px;">{{ paragraph|urlize|linebreaksbr }}</p>
            {% endfor %}
{% endblock %}
