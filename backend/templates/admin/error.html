{% extends "admin/base_site.html" %}
{% load bos_admin %}
{% block breadcrumbs %}<div class="breadcrumbs"><a href="{% url 'admin:index' %}">Overview</a> &rsaquo; {{ heading }}</div>{% endblock %}
{% block content_title %}{% endblock %}
{% block content %}
<div class="bos-card bos-error-page">
  <span class="bos-error-code">{{ code }}</span>
  <h1>{{ heading }}</h1>
  <p class="bos-lead">{{ message }}</p>
  <div class="bos-page-tools">
    <a class="bos-btn bos-btn-primary" href="{% url 'admin:index' %}">{% icon 'home' %} Back to overview</a>
    <button type="button" class="bos-btn" data-bos-palette-open>{% icon 'search' %} Find a page</button>
  </div>
</div>
{% endblock %}
