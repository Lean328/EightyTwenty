# Local PostgreSQL only. These credentials are disposable development defaults.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: eightytwenty
      POSTGRES_USER: bos
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - bos_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bos -d eightytwenty"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  bos_db:
