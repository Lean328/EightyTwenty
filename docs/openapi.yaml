  /api/v1/app/locations/{slug}/menu:
    get:
      operationId: v1_app_locations_menu_list
      description: |-
        The menu at one café, in menu order: chain-wide items plus items only this café sells, with
        this café's prices. Items the café marked **sold out** or **hidden** in BOS are left out.

        - `priceCents` is the base price; each option's `priceCents` is added when chosen.
        - `maxSelections`: 1 = single choice, 0 = any number. A `required` group needs at least one
          option.
        - Option **names** identify options inside a group: send them back in `selections`.
        - `dietary` uses display strings: `GF*`, `DF*`, `Gluten free`, `Dairy free`, `Vegan`,
          `Vegetarian` (`*` = option on request).

        `404` "That café could not be found."
      summary: A café's menu (sold-out and hidden items left out)
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - App · Cafés & menu
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MenuItemOut'
              examples:
                Menu:
                  value:
                  - - id: hotcoffee
                      categoryId: coffee
                      name: Milk Based Coffee
                      description: ''
                      priceCents: 500
                      dietary: []
                      imageUrl: https://example.supabase.co/storage/v1/object/public/media/website/91aa/800.webp
                      featured: true
                      modifierGroups:
                      - id: drink
                        name: Choose your drink
                        required: true
                        maxSelections: 1
                        options:
                        - name: Flat White
                          priceCents: 50
                        - name: Latte
                          priceCents: 50
                        - name: Macchiato
                          priceCents: 0
                      - id: var
                        name: Drink variation
                        required: false
                        maxSelections: 0
                        options:
                        - name: Large
                          priceCents: 100
                        - name: OAT ADC
