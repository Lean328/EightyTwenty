  /api/v1/app/reservations:
    post:
      operationId: v1_app_reservations_create
      description: |-
        Sends a table **request**; the café confirms it. Saved in BOS → Bookings; the café inbox and
        the guest are emailed.

        **Checks, in order** (Canberra time):
        1. café has confirmed hours — else `422 LOCATION_UNAVAILABLE` "Bookings open when hours are confirmed."
        2. `date` present and after today — else `422` `fields.date: "invalid"` "Choose a date from tomorrow onwards."
        3. everything else at once — every failing field (`guests` 1–100, `time`, `name`, `phone`
           8+ digits, `email`) set to `"invalid"`. The message is the time problem when there is
           one — "Café is closed on this date", "Café is closed at this time" (last booking 30 min
           before close), "Bookings need at least 12 hours’ notice" — otherwise "Please check the
           highlighted fields."
      summary: Request a table (the café confirms it)
      tags:
      - App · Bookings & catering
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservationInRequest'
            examples:
              TableRequest:
                value:
                  locationId: braddon
                  date: '2026-10-15'
                  time: 09:30
                  guests: 2
                  seating: outdoor
                  name: Sophie Nguyen
                  phone: 0400 123 456
                  email: sophie@example.com
                  notes: High chair please
                summary: Table request
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationOut'
              examples:
                Requested:
                  value:
                    id: 1c9e4f22-0e1f-4b8e-a0c5-0d3b8c1f7a11
                    locationId: braddon
                    date: '2026-10-15'
                    time: 09:30
                    guests: 2
                    seating: outdoor
                    status: requested
                    createdAt: '2026-10-12T08:20:00+11:00'
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
              examples:
                DateTooSoon:
                  value:
                    error:
                      code: VALIDATION
                      message: Choose a date from tomorrow onwards.
                      fields:
                        date: invalid
                  summary: Date too soon
                OutsideHours:
                  value:
                    error:
                      code: VALIDATION
                      message: Café is closed at this time
                      fields:
                        time: invalid
                  summary: Outside hours
          description: ''
        '400':
          description: 'App error: {error: {code, message, fields}}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '401':
          description: 'App error: {error: {code, message, fields}}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '403':
          description: 'App error: {error: {code, message, fields}}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '404':
          description: 'App error: {error: {code, message, fields}}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '409':
          description: 'App error: {error: {code, message, fields}}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '429':
          description: 'App error: {error: {code, message, fields}}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '503':
          description: 'App error: {error: {code, message, fields}}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
