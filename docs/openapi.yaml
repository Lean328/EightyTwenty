  /api/v1/app/orders:
    post:
      operationId: v1_app_orders_create
      description: |-
        Places an order. **The server re-prices every line** from its own menu and charges only the
        total the customer saw (`expectedTotalCents`).

        Send an `Idempotency-Key` header (the app sends `ord_…`). A retry with the same key and the
        same body returns the original order (`201`) without charging again; the same key with a
        different body → `409 CONFLICT`.

        **Pricing**, in integer cents: subtotal → +10% delivery → −free coffee (one unit of the
        cheapest coffee line, with 9 stamps and `useReward: true`) → +2.95% card surcharge
        (`saved_card`/`new_card`, never Apple Pay) → −gift card → total. The two rate steps round
        half-up to a cent.

        **Checks, in order** (first failure returned):
        1. café takes orders — else `422 LOCATION_UNAVAILABLE` "This café isn’t taking orders yet."
        2. `method` offered there — "Delivery isn’t offered at Civic."
        3. `deliveryAddress` for delivery / `tableNumber` for dine-in (`fields…: "required"`)
        4. at least one line — "Your order is empty."
        5. every item on this café's menu and not sold out — "An item in your order is no longer available."
        6. options valid and required groups chosen — "Choose options for {item}."
        7. server total = `expectedTotalCents` — `409 PRICE_CHANGED` "Your total changed to $X.XX. Please review your order."
        8. `saved_card` — `422` `fields.paymentMethodId` "Choose a saved card." (no saved cards yet)
        9. money due — `402 PAYMENT_DECLINED` without a token; **`501 NOT_IMPLEMENTED` until a
           payment provider is connected**. Orders the gift card fully covers need no token.

        On success the order starts as `received`; stamps are added, a redeemed free coffee resets
        the card, the gift card is charged and the café inbox is emailed.
      summary: Place an order (server re-prices it; send an Idempotency-Key header)
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
      tags:
      - App · Orders & payments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderInRequest'
            examples:
              Pickup,Card+GiftCard:
                value:
                  locationId: braddon
                  method: pickup
                  timing:
                    type: asap
                  deliveryAddress: null
                  tableNumber: null
                  lines:
                  - itemId: hotcoffee
                    qty: 1
                    selections:
                      drink:
                      - Flat White
                      var:
                      - OAT ADC
                    note: ''
                  - itemId: bburger
                    qty: 1
                    selections:
                      style:
                      - Original
                    note: No beetroot relish
                  payment:
                    choice: new_card
                    token: <single-use provider token>
                  useGiftCard: true
                  useReward: false
                  contact:
                    name: Sophie Nguyen
                    phone: 0400 123 456
                  expectedTotalCents: 2016
                summary: Pickup, card + gift card
              Delivery,ApplePay,FreeCoffee:
                value:
                  locationId: braddon
                  method: delivery
                  timing:
                    type: asap
                  deliveryAddress: 12 Smith St, Braddon ACT 2612
                  tableNumber: null
                  lines:
                  - itemId: hotcoffee
                    qty: 1
                    selections:
                      drink:
                      - Flat White
                      var:
                      - OAT ADC
                    note: ''
                  - itemId: bburger
                    qty: 1
                    selections:
                      style:
                      - Original
                    note: No beetroot relish
                  payment:
                    choice: apple_pay
                    token: <Apple Pay token>
                  useGiftCard: false
                  useReward: true
                  contact:
                    name: Sophie Nguyen
                    phone: 0400 123 456
                  expectedTotalCents: 2593
                summary: Delivery, Apple Pay, free coffee
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderOut'
              examples:
                OrderReceived:
                  value:
                    id: 4458a402-6f66-47eb-893a-63faa08137eb
                    number: '#8020-1197'
                    locationId: braddon
                    locationName: Braddon
                    method: pickup
                    status: received
                    createdAt: '2026-10-12T08:12:40+11:00'
                    timing:
                      type: asap
                    deliveryAddress: null
                    tableNumber: null
                    lines:
                    - itemId: hotcoffee
                      name: Milk Based Coffee
                      qty: 1
                      unitPriceCents: 630
                      selections:
                        drink:
                        - Flat White
                        var:
                        - OAT ADC
                      modifiersLabel: Flat White, OAT ADC
                      note: ''
                    - itemId: bburger
                      name: Breakfast Burger
                      qty: 1
                      unitPriceCents: 2300
                      selections:
                        style:
                        - Original
                      modifiersLabel: Original
                      note: No beetroot relish
                    totals:
                      subtotalCents: 2930
                      deliveryCents: 0
                      rewardCents: 0
                      surchargeCents: 86
                      giftCardCents: 1000
                      totalCents: 2016
                    paymentLabel: Card + gift card
                    stampsEarned: 1
                    rewardRedeemed: false
                    estimatedWait: 20–25 min
                  summary: Order received
          description: ''
        '402':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
              examples:
                MissingToken:
                  value:
                    error:
                      code: PAYMENT_DECLINED
                      message: Payment was not completed.
                      fields: {}
                  summary: Missing token
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
              examples:
                PriceChanged:
                  value:
                    error:
                      code: PRICE_CHANGED
                      message: Your total changed to $20.16. Please review your order.
                      fields: {}
                  summary: Price changed
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
              examples:
                Coming-soonCafé:
                  value:
                    error:
                      code: LOCATION_UNAVAILABLE
                      message: This café isn’t taking orders yet.
                      fields: {}
                  summary: Coming-soon café
          description: ''
        '501':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
              examples:
                NoPaymentProviderYet:
                  value:
                    error:
                      code: NOT_IMPLEMENTED
                      message: Card and Apple Pay payments aren’t available in the
                        app yet. Please order at the café.
                      fields: {}
                  summary: No payment provider yet
          description: ''
        '400':
          description: 'App error: {error: {code, message, fields}}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '401':
          description: 'App error: {error: {code, message, fields}}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '403':
          description: 'App error: {error: {code, message, fields}}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '404':
          description: 'App error: {error: {code, message, fields}}'
          content:
