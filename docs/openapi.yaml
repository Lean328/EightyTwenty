openapi: 3.0.3
info:
  title: EightyTwenty BOS API
  version: 1.0.0
  description: Shared REST API for the website, mobile app and BOS. Money uses integer
    AUD cents except public compatibility endpoints. No trailing slash.
paths:
  /api/v1/app/auth/password-reset:
    post:
      operationId: v1_app_auth_password_reset_create
      description: |-
        Emails a reset link when the email belongs to an account. Always `204`, so the form cannot
        reveal who has an account.

        The link opens `https://<api-host>/account/reset-password?uid=…&token=…`, a small page on
        this server where the customer chooses a new password. It works once, for 3 days, and
        signs the customer out everywhere. The app only shows "Check your email for a reset link".
      summary: Email a password reset link
      tags:
      - App · Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailInRequest'
        required: true
      security:
      - {}
      responses:
        '204':
          description: No response body
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: ''
        '400':
          description: 'App error: {error: {code, message, fields}}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '401':
          description: 'App error: {error: {code, message, fields}}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '403':
          description: 'App error: {error: {code, message, fields}}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '404':
          description: 'App error: {error: {code, message, fields}}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '409':
          description: 'App error: {error: {code, message, fields}}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '429':
          description: 'App error: {error: {code, message, fields}}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '503':
          description: 'App error: {error: {code, message, fields}}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
  /api/v1/app/auth/refresh:
    post:
      operationId: v1_app_auth_refresh_create
      description: |-
        Swaps a refresh token for a **new access token and a new refresh token**.

        Refresh tokens are single use and last 30 days; access tokens last 15 minutes. The app's
        HTTP client calls this once when any call answers `401`, then retries the call.

        **Errors** — `401 UNAUTHORIZED` when the token is expired, revoked or already used (the app
        then signs the customer out: "Your session has expired"). Server or network trouble answers
        `5xx` instead, so the app keeps the customer signed in.
      summary: Swap a refresh token for a new session
      tags:
      - App · Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshInRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionOut'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: ''
        '400':
          description: 'App error: {error: {code, message, fields}}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '403':
          description: 'App error: {error: {code, message, fields}}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '404':
          description: 'App error: {error: {code, message, fields}}'
          content:
            application/json:
              schema:
