        phone:
          type: string
          maxLength: 32
        role:
          $ref: '#/components/schemas/RoleEnum'
        is_active:
          type: boolean
      required:
      - email
    Version:
      type: object
      properties:
        version:
          type: integer
      required:
      - version
    APIError:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          - fields
          properties:
            code:
              type: string
            message:
              type: string
            fields:
              oneOf:
              - type: object
                additionalProperties: {}
              - type: array
                items: {}
  securitySchemes:
    JobToken:
      type: apiKey
      in: header
      name: X-Job-Token
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
