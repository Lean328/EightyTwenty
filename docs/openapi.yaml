  /api/v1/bos/bookings:
    get:
      operationId: v1_bos_bookings_list
      parameters:
      - in: query
        name: date
        schema:
          type: string
          format: date
      - in: query
        name: date__gte
        schema:
          type: string
          format: date
      - in: query
        name: date__lte
        schema:
          type: string
          format: date
      - in: query
        name: location
        schema:
          type: string
        description: Location slug
      - in: query
        name: location__slug
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - cancelled
          - confirmed
          - declined
          - no_show
          - requested
          - seated
        description: |-
          * `requested` - Requested
          * `confirmed` - Confirmed
          * `declined` - Declined
          * `cancelled` - Cancelled
          * `seated` - Seated
          * `no_show` - No Show
      tags:
      - bos/bookings
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBookingList'
          description: ''
        '400':
