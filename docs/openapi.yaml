components:
  schemas:
    AuditLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        action:
          type: string
          maxLength: 60
        entity_type:
          type: string
          maxLength: 100
        entity_id:
          type: string
          maxLength: 100
        before:
          nullable: true
        after:
          nullable: true
        ip:
          type: string
          nullable: true
        actor:
          type: string
          format: uuid
          nullable: true
      required:
      - action
      - created_at
      - entity_id
      - entity_type
      - id
      - updated_at
    Booking:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        reference:
          type: string
          readOnly: true
        date:
          type: string
          format: date
          readOnly: true
        time:
          type: string
          format: time
          readOnly: true
        party_size:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        phone:
          type: string
          readOnly: true
        notes:
          type: string
        status:
          $ref: '#/components/schemas/BookingStatus'
        source:
          allOf:
          - $ref: '#/components/schemas/BookingSourceEnum'
          readOnly: true
        handled_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_by:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        updated_by:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        location:
          type: string
          format: uuid
          readOnly: true
        customer:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        handled_by:
          type: string
          format: uuid
          readOnly: true
          nullable: true
      required:
      - created_at
      - created_by
      - customer
      - date
      - email
      - handled_at
      - handled_by
      - id
      - location
      - name
      - party_size
      - phone
      - reference
      - source
      - time
      - updated_at
      - updated_by
    BookingReceipt:
      type: object
      properties:
        reference:
          type: string
        status:
          $ref: '#/components/schemas/BookingReceiptStatusEnum'
      required:
      - reference
      - status
    BookingReceiptStatusEnum:
      enum:
      - requested
      type: string
      description: '* `requested` - requested'
    BookingRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        is_enabled:
          type: boolean
        slot_minutes:
          type: integer
          maximum: 240
          minimum: 5
        max_party_size:
          type: integer
          maximum: 32767
          minimum: 1
        max_covers_per_slot:
          type: integer
          maximum: 32767
          minimum: 1
        min_lead_minutes:
          type: integer
          maximum: 2147483647
          minimum: 0
        max_days_ahead:
          type: integer
          maximum: 365
          minimum: 1
        created_by:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        updated_by:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        location:
          type: string
          format: uuid
      required:
      - created_at
      - created_by
      - id
      - location
      - updated_at
      - updated_by
    BookingRuleRequest:
      type: object
      properties:
        is_enabled:
          type: boolean
        slot_minutes:
          type: integer
          maximum: 240
          minimum: 5
        max_party_size:
          type: integer
          maximum: 32767
          minimum: 1
        max_covers_per_slot:
          type: integer
          maximum: 32767
          minimum: 1
        min_lead_minutes:
          type: integer
          maximum: 2147483647
          minimum: 0
        max_days_ahead:
          type: integer
          maximum: 365
          minimum: 1
        location:
          type: string
          format: uuid
      required:
      - location
    BookingSlot:
      type: object
      properties:
        time:
          type: string
          format: time
        remaining_covers:
          type: integer
        max_party_size:
          type: integer
      required:
      - max_party_size
      - remaining_covers
      - time
    BookingSourceEnum:
      enum:
      - web
      - app
