name: Scheduled backend jobs
on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
permissions:
  contents: read
concurrency:
  group: backend-scheduled-jobs
  cancel-in-progress: false
jobs:
  maintenance:
    if: vars.ENABLE_BOS_JOBS == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/run_jobs.py
        env:
          BOS_API_BASE: ${{ vars.BOS_API_BASE }}
          JOB_TOKEN: ${{ secrets.BOS_JOB_TOKEN }}
