name: Mobile CI
on:
  push:
    paths: ["mobile/**", ".github/workflows/mobile.yml"]
  pull_request:
    paths: ["mobile/**", ".github/workflows/mobile.yml"]
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # Includes the phone-only crash guards (worklets, text nodes) and the screen smoke test.
      - run: npx jest --ci
      - run: npx expo-doctor
      # The JavaScript bundles a release build would ship (no native build here).
      - run: npx expo export --platform ios --output-dir ${{ runner.temp }}/ios
      - run: npx expo export --platform android --output-dir ${{ runner.temp }}/android
