name: Backend CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bos
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: bos_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bos -d bos_ci"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://bos:ci-only-password@localhost:5432/bos_ci
      DJANGO_SETTINGS_MODULE: config.settings
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/constraints.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: pytest -q
      - run: python manage.py spectacular --file ../docs/openapi.yaml --validate --fail-on-warn
      - run: git diff --exit-code -- ../docs/openapi.yaml
